{% extends 'base/base.html' %}
{% load static %}

{% block title %}
  {{ title }}
{% endblock %}

{% block content %}

  {% if messages %}
        <ul class="messages">
          {% for message in messages %}
          <li {% if message.tags %} class="{{ message.tags }}"{% endif %} id="message_box">
            <button type="button" onclick="buttonclose()">&times;</button>
            {{ message }}
          </li>  
          {% endfor %}
        </ul>
  {% endif %}

<h2 class="text-center m-3">{{ message }}</h2>

  <div class="container pb-5 d-flex justify-content-center">
    <form action="" method="post">
      {% csrf_token %}
      {{ register_form }}
      <button class="btn btn-success">عضویت</button>
    </form>
  </div>

{% endblock %}
