{% extends "dashboard/base_dashboard.html" %}

{% block dashboard_content %}

<h1>{{ message }}</h1>

<div class="container">
    <form action="" method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {{ form }}

      {{ formset.management_form }}
      {% for img_form in formset %}
          {{ img_form.as_p }}
      {% endfor %}

      <button >send</button>
    </form>
  </div>

{% endblock %}
