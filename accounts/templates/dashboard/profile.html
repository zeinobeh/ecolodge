{% extends "dashboard/base_dashboard.html" %}

{% block dashboard_content %}


  {% if messages %}
        <ul class="messages">
          {% for message in messages %}
          <li {% if message.tags %} class="{{ message.tags }}"{% endif %} id="message_box">
            <button type="button" class="btn-close" onclick="buttonclose()"></button>
            {{ message }}
          </li>  
          {% endfor %}
        </ul>
  {% endif %}


<div class="container">

    <form action="" method="post">
      {% csrf_token %}
      {{ profile_form }}
      <button type="submit" class="btn btn-success" >ثبت</button>
    </form>
    
  </div>

{% endblock %}
