{% extends 'base/base.html' %}
{% load static %}

{% block content %}


{% for image in lodge.images.all %}
    <img src="{{ image.image.url }}" alt="{{ lodge.title }}" />
{% endfor %}


<h1>{{ lodge.title }}</h1>
<p>{{ lodge.description }}</p>
<h2>{{ lodge.province}}</h2>
<h2>{{ lodge.city}}</h2>
<p>{{ lodge.address }}</p>
<h2>{{ lodge.capacity}}</h2>
<h2>{{ lodge.price}}</h2>

<!-- <p>{{lodge.interests}}</p> -->

{% endblock %}
